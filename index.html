<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%2300574A%22/%3E%3Cpath d=%22M9 28L14 4M23 28L18 4%22 stroke=%22%236BD688%22 stroke-width=%223%22/%3E%3C/svg%3E">
  <title>Street Concept App</title>
  <meta name="description" content="Street concept packages for Southern California: site, existing section, alternatives, cost, renderings, sheets, review.">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>STREET CONCEPT APP</h1>
      <div class="proj">
        <input id="proj-name" aria-label="Project name" placeholder="Project name">
        <button class="btn ghost" id="export">Export</button>
        <label class="btn ghost" for="import" style="display:inline-grid;place-items:center">Import</label>
        <input id="import" type="file" accept="application/json" hidden>
      </div>
    </header>
    <nav class="stages" id="stages" aria-label="Stages"></nav>
    <div class="work">
      <aside class="side" id="side"></aside>
      <section class="canvas" id="canvas" aria-label="Workspace"></section>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
